name: CI

# A main ág az éles kód forrása, ezért ez az egyetlen kapu közte és a szerver
# között: ami itt piros, azt nem telepítjük.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ellenorzes:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # A 8.2 a composer.json-ban ígért minimum: ez fogja meg, ha véletlenül
        # újabb nyelvi elemet írunk. A 8.4 az, ami élesben a webcímen fut.
        php: ['8.2', '8.4']

    services:
      postgres:
        # Szándékosan 11: ez fut a nethely tárhelyen. A CI akkor ér valamit, ha
        # a tényleges éles adatbázis-verzió ellen bizonyít. Ha a szolgáltató
        # frissít, ezt a sort kell átírni — és a tesztsor megmondja, mikor lehet.
        image: postgres:11
        env:
          POSTGRES_DB: szamlafolyo_test
          POSTGRES_USER: szamlafolyo
          POSTGRES_PASSWORD: szamlafolyo
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    name: PHP ${{ matrix.php }} · PostgreSQL 11

    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Ugyanaz a kiterjesztéslista, amit a tárhelyen is elvárunk
          # (App\Console\Commands\KornyezetEllenoriz).
          extensions: pdo_pgsql, mbstring, intl, gd, zip, fileinfo, curl, xmlreader
          coverage: none

      - name: Composer gyorsítótár
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Kód formázás
        if: matrix.php == '8.4'
        run: vendor/bin/pint --test

      - name: Környezet-ellenőrzés
        run: php artisan kornyezet:ellenoriz
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: szamlafolyo_test
          DB_USERNAME: szamlafolyo
          DB_PASSWORD: szamlafolyo

      - name: Tesztek
        run: vendor/bin/phpunit --no-coverage
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432

      - uses: actions/setup-node@v4
        if: matrix.php == '8.4'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: matrix.php == '8.4'

      # A lefordított eszközök a repóban utaznak (a tárhelyen nincs Node.js),
      # ezért ellenőrizzük, hogy a bekommitolt build a forrással egyezik-e.
      - name: Frontend fordítás
        if: matrix.php == '8.4'
        run: |
          npm run build
          if ! git diff --quiet -- public/build; then
            echo "A public/build nincs szinkronban a forrással. Futtasd: npm run build"
            git --no-pager diff --stat -- public/build
            exit 1
          fi
