<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SzámlaFolyó">
  <title>SzámlaFolyó</title>
  <defs>
    <linearGradient id="sf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c66c47"/>
      <stop offset="1" stop-color="#9e5537"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#sf)"/>
  <!-- Kitöltött lap, sarkán behajtással. Kitöltve, nem körvonallal: 16
       pixelen a vonalas rajz elmosódik, a tömör folt megmarad. -->
  <path d="M8.5 5.5h9.2l5.8 5.8v14.2a1.5 1.5 0 0 1-1.5 1.5H8.5A1.5 1.5 0 0 1 7 25.5v-18.5a1.5 1.5 0 0 1 1.5-1.5z"
        fill="#fdf6ef"/>
  <path d="M17.7 5.5v4.3a1.5 1.5 0 0 0 1.5 1.5h4.3" fill="none" stroke="#c66c47"
        stroke-width="1.4" stroke-linejoin="round"/>
  <!-- A folyó: a lapon átfutó adat. Ez a márkajel lényege, ezért ez a
       legvastagabb vonal a rajzon. -->
  <path d="M10.5 19.2c1.5-1.7 3.2-1.7 4.7 0s3.2 1.7 4.7 0" fill="none" stroke="#a85c3c"
        stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
